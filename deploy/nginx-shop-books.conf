# /etc/nginx/sites-available/shop-books.ali-moradi-develop.com  (symlink into sites-enabled)
# Then: nginx -t && systemctl reload nginx && certbot --nginx -d shop-books.ali-moradi-develop.com
server {
    listen 80;
    server_name shop-books.ali-moradi-develop.com;

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
