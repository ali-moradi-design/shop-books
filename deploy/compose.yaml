# /srv/apps/shop-books/compose.yaml: web + api + their own Postgres.
# Images are built in CI (.github/workflows/docker.yml) and only pulled here.
# .env next to this file holds IMAGE_TAG (the commit SHA to run) and the secrets
# (names in .env.example). deploy-app changes only the IMAGE_TAG line.
name: shop-books

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set}
      POSTGRES_DB: bookstore
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [backend]
    # no published ports: only the api reaches the database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d bookstore"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped

  api:
    image: ghcr.io/ali-moradi-design/shop-books-api:${IMAGE_TAG:?IMAGE_TAG is not set}
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://app:${DB_PASSWORD}@db:5432/bookstore?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is not set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is not set}
      ACCESS_TOKEN_TTL: 12h
      REFRESH_TOKEN_TTL: 7d
      CORS_ORIGIN: https://shop-books.ali-moradi-develop.com
      COOKIE_SECURE: "true"
      # seed and the nightly demo reset tell the storefront to drop its cached catalog
      WEB_REVALIDATE_URL: http://web:3000/hooks/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET is not set}
      # Prisma must not phone home or write caches on a read-only disk
      CHECKPOINT_DISABLE: "1"
    volumes:
      - uploads:/repo/apps/api/uploads
    networks: [backend, frontend]
    depends_on:
      db:
        condition: service_healthy
    # the image's HEALTHCHECK calls /api/health; migrations run at start, so give it time
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    restart: unless-stopped

  web:
    image: ghcr.io/ali-moradi-design/shop-books-web:${IMAGE_TAG:?IMAGE_TAG is not set}
    environment:
      API_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: https://shop-books.ali-moradi-develop.com
      COOKIE_SECURE: "true"
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    # Nginx on the host proxies to this; Docker bypasses ufw, so loopback only
    ports:
      - "127.0.0.1:3101:3000"
    networks: [frontend]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    restart: unless-stopped

networks:
  backend:
    internal: true # the database has no internet and nothing outside reaches it
  frontend: {}

volumes:
  db-data:
  uploads:
