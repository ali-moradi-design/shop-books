# shop-books.ali-moradi-develop.com -> the web container on 127.0.0.1:3101.
# Save as /etc/nginx/sites-available/shop-books, symlink into sites-enabled,
# `nginx -t`, `systemctl reload nginx`. certbot --nginx then adds the TLS
# block; edit the live file by hand after that.
server {
    listen 80;
    listen [::]:80;
    server_name shop-books.ali-moradi-develop.com;

    server_tokens off;
    client_max_body_size 2m; # the API's upload route is not public

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # always overwrite: visitors cannot choose their own IP (rate limits)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
