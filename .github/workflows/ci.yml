name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shop-books/api exec prettier --check "src/**/*.ts" "tests/**/*.ts"
      - run: pnpm --filter @shop-books/api lint
      - run: pnpm --filter @shop-books/api exec tsc --noEmit
      - run: pnpm --filter @shop-books/api test
      - run: pnpm --filter @shop-books/api build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shop-books/web exec prettier --check src e2e
      - run: pnpm --filter @shop-books/web lint
      - run: pnpm --filter @shop-books/web typecheck
      - run: pnpm --filter @shop-books/web test
      - run: pnpm --filter @shop-books/web exec playwright install --with-deps chromium
      - name: E2E (purchase path) and axe checks
        run: pnpm --filter @shop-books/web test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results

  # One stable name to mark as the required status check in branch protection.
  ci:
    if: always()
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - env:
          API: ${{ needs.api.result }}
          WEB: ${{ needs.web.result }}
        run: test "$API" = success && test "$WEB" = success
